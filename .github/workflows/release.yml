name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-context:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      target_sha: ${{ steps.version.outputs.target_sha }}
      archive: ${{ steps.version.outputs.archive }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check tag and version
        id: version
        run: |
          set -euo pipefail

          version="$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^\"]+)".*/\1/p' _meta.lua | head -n 1)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: _meta.lua version must use X.Y.Z format (got: ${version:-missing})" >&2
            exit 1
          fi

          tag="v$version"
          if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "error: pushed tag $GITHUB_REF_NAME does not match _meta.lua version $tag" >&2
            exit 1
          fi

          git fetch origin main --quiet
          target_sha="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$target_sha" origin/main; then
            echo "error: release tag must point to a commit on main" >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "target_sha=$target_sha"
            echo "archive=dist/weread.koplugin-$tag.zip"
          } >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: release-context
    uses: ./.github/workflows/ci.yml

  koreader-integration:
    name: KOReader integration
    needs: release-context
    uses: ./.github/workflows/koreader-integration.yml

  publish:
    name: Package and publish GitHub Release
    needs:
      - release-context
      - ci
      - koreader-integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-context.outputs.target_sha }}

      - name: Build plugin package
        env:
          ARCHIVE: ${{ needs.release-context.outputs.archive }}
        run: bash scripts/package_release.sh "$ARCHIVE"

      - name: Generate checksum
        env:
          ARCHIVE: ${{ needs.release-context.outputs.archive }}
        run: |
          (
            cd "$(dirname "$ARCHIVE")"
            sha256sum "$(basename "$ARCHIVE")" > "$(basename "$ARCHIVE").sha256"
          )
          cat "$ARCHIVE.sha256"

      - name: Verify package contents
        env:
          ARCHIVE: ${{ needs.release-context.outputs.archive }}
        run: |
          set -euo pipefail
          unzip -l "$ARCHIVE"
          test "$(unzip -Z1 "$ARCHIVE" | head -n 1)" = "weread.koplugin/"
          unzip -Z1 "$ARCHIVE" | grep -qx "weread.koplugin/main.lua"
          unzip -Z1 "$ARCHIVE" | grep -qx "weread.koplugin/_meta.lua"
          unzip -Z1 "$ARCHIVE" | grep -qx "weread.koplugin/icons/weread-w-book.svg"
          unzip -Z1 "$ARCHIVE" | grep -qx "weread.koplugin/integrations/init.lua"
          unzip -Z1 "$ARCHIVE" | grep -qx "weread.koplugin/integrations/zenui.lua"
          if unzip -Z1 "$ARCHIVE" | grep -Eq '^weread\.koplugin/(spec|scripts|docs|\.github)/'; then
            echo "error: development-only files were included in the release package" >&2
            exit 1
          fi

      - name: Build release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-context.outputs.tag }}
          TARGET_SHA: ${{ needs.release-context.outputs.target_sha }}
          VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          bash scripts/extract_release_notes.sh "$VERSION" dist/release-preface.md
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="$TARGET_SHA" \
            --jq '.body' > dist/generated-release-notes.md
          cat dist/release-preface.md dist/generated-release-notes.md > dist/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-context.outputs.tag }}
          VERSION: ${{ needs.release-context.outputs.version }}
          TARGET_SHA: ${{ needs.release-context.outputs.target_sha }}
          ARCHIVE: ${{ needs.release-context.outputs.archive }}
        run: |
          gh release create "$TAG" \
            "$ARCHIVE" \
            "$ARCHIVE.sha256" \
            --target "$TARGET_SHA" \
            --title "Version $VERSION" \
            --notes-file dist/release-notes.md
